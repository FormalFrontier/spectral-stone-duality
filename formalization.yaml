automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents use Lean, Lake and Git for formalization
        and maintenance.

status:
  scope: >-
    Reusable bounded distributive-lattice Stone duality and the documented
    spectral-limit, cylinder and subspace topology, together with general
    soberification and its reflective adjunction, plus universal finite
    coproducts and conditional disjointness in thin lattice categories.
    The original point is the unique closed point among its generizations
    in a T0 space.
    Finite-limit- and finite-colimit-preserving functors between thin bounded
    lattice categories correspond to bounded lattice homomorphisms; the
    binary preservation laws also hold for the corresponding semilattices.
    Cofinite topology is quasi-sober precisely on finite underlying types,
    with no nonemptiness assumption.
    Source-specific correspondence and coverage decisions are maintained
    separately.

review:
  status: "agent-reviewed"

