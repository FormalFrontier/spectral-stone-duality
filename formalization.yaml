# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "spectral-stone-duality"
  description: >-
    Prime-ideal spectra of bounded distributive lattices and their
    contravariant equivalence with spectral spaces. Also proves spectrality
    of small cofiltered limits with spectral arrows, compact-open cylinder
    bases and descent over actual limits, and compact-open lifting from
    arbitrary subspaces of prespectral spaces. Finite labelled families,
    including empty families, descend to coherent whole-stage covers. Also
    constructs the soberification of any topological space and its reflection
    into T0 quasi-sober spaces, independently of spectral Stone duality.
    In T0 spaces, the original point is the unique closed point of its
    generization subspace, without a spectrality assumption.
    Finite joins in the underlying order category of a distributive lattice
    with bottom are universal coproducts; disjointness is characterized by
    pairwise-zero meets at distinct indices.
    Functors between thin order categories of bounded lattices preserve finite
    limits and colimits exactly when their object maps are bounded lattice
    homomorphisms, without distributivity or shared carrier universe.
    A cofinite space is quasi-sober exactly when its underlying type is finite,
    including the empty space.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Stone duality for bounded distributive lattices and spectral spaces"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Prime order ideals, compact opens and spectral maps; the space-side
      reconstruction assumes spectrality and hence sobriety. No mathematical
      novelty or source-author endorsement is claimed.
  - title: "Cofiltered spectral limits, cylinders and subspaces"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Small cofiltered diagrams require spectral stages and spectral arrows;
      limit nonemptiness separately requires objectwise nonemptiness. Cylinder
      descent uses an actual IsLimit cone and Over witnesses, with a compact
      open on the left and a merely open set on the right. Finite labels may be
      empty; coherent arrows give covers of an entire stage. Arbitrary-subspace
      compact-open lifting requires no closedness. No sheaf gluing is asserted.
  - title: "Soberification of topological spaces"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      The irreducible-closed construction gives a T0 quasi-sober reflection
      of every topological space; the unit and categorical adjunction impose
      no separation or spectrality condition on the input. This general-topology
      result is separate from reconstruction of spectral spaces.
  - title: "Cofinite quasi-sobriety"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Finite cofinite spaces, including the empty space, are sober; infinite
      cofinite spaces are irreducible and T1 but lack a generic point.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    location: "Chapter 0, Sections 1.2(e) and 2.2(b)"
    relationship: "background"
    note: >-
      The thin order-category interpretation motivates finite coproduct
      universality and conditional disjointness. The source assumes a bounded
      distributive lattice; the finite-coproduct results require only bottom.
      Its finite-operation preservation motivates the more general bounded
      lattice-map equivalence, which does not require distributivity.
      No claim of complete source formalization is made.

