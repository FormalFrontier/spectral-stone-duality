# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "spectral-stone-duality"
  description: >-
    Prime-ideal spectra of bounded distributive lattices and their
    contravariant equivalence with spectral spaces. Also proves spectrality
    of small cofiltered limits with spectral arrows, compact-open cylinder
    bases and descent over actual limits, and compact-open lifting from
    arbitrary subspaces of prespectral spaces. Finite labelled families,
    including empty families, descend to coherent whole-stage covers.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Stone duality for bounded distributive lattices and spectral spaces"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Prime order ideals, compact opens and spectral maps; the space-side
      reconstruction assumes spectrality and hence sobriety. No mathematical
      novelty or source-author endorsement is claimed.
  - title: "Cofiltered spectral limits, cylinders and subspaces"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Small cofiltered diagrams require spectral stages and spectral arrows;
      limit nonemptiness separately requires objectwise nonemptiness. Cylinder
      descent uses an actual IsLimit cone and Over witnesses, with a compact
      open on the left and a merely open set on the right. Finite labels may be
      empty; coherent arrows give covers of an entire stage. Arbitrary-subspace
      compact-open lifting requires no closedness. No sheaf gluing is asserted.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    location: "Chapter 0, Section 2.2"
    relationship: "background"
    note: >-
      Motivating reference only; no claim of complete source formalization.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Native order ideals, frame points, spectral topology and category APIs,
      pinned at the revision in the Lake manifest.
  - id: "https://github.com/FormalFrontier/ideal-completion"
    relationship: "builds-on"
    note: >-
      Ideal completion and compact-principal results, pinned to the official
      published commit 001e3b7508184ecd51e0d86177cb1d54508bf59d.
      This dependency is private and requires authorized GitHub access.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents use Lean, Lake and Git for formalization
        and maintenance; independent review is recorded by exact revision.
  notes: >-
    AI assistance and independent review are distinct; service identities
    alone do not establish proof correctness or review acceptance.

status:
  scope: >-
    Reusable bounded distributive-lattice Stone duality and the documented
    spectral-limit, cylinder and subspace topology. Source-specific
    correspondence and coverage decisions are maintained separately.

review:
  status: "other: consult exact-revision independent review and release records"
  notes: >-
    Earlier accepted mathematical developments and published snapshots do not
    themselves review or release a changed candidate. Build and complete
    private-inclusive transitive standard-axiom evidence must apply to the
    actual checked inputs. This metadata does not self-certify acceptance,
    redistribution rights or source coverage.

acknowledgements: >-
  Lean and mathlib contributors for the proof assistant and mathematical
  infrastructure; ideal-completion contributors for its separately maintained
  library; the Formal Frontier source-maintainer team for development and review.
